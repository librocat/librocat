packages:
  - packages/*

# pnpm runs no install scripts unless the package is listed here. esbuild's
# postinstall only swaps its JS shim for the raw binary, which breaks pnpm's
# shim, so it stays off.
allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.13'
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/linux-arm64@2.10.13'
  - '@turbo/windows-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - turbo@2.10.13
